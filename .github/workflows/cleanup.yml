# Daily data retention: deletes unpublished reviews and inactive profiles 30 days after their expireAt.
# Signs in to Google Cloud with Workload Identity (no stored keys); only this repo's main branch is allowed.
name: Daily cleanup

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Delete expired data
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/963565839058/locations/global/workloadIdentityPools/github/providers/antarodaya-repo
          service_account: cleanup-bot@antarodaya-in.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
      - name: Delete expired documents
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/cleanup.py
