# Checks every push and pull request: the generated pages are up to date, links resolve,
# no secrets are committed, and login / reviews / admin / security rules work end to end.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pages are built from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rebuild pages
        run: python3 scripts/build.py
      - name: Generated files must be committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Run 'python3 scripts/build.py' and commit the generated files."
            exit 1
          fi

  links:
    name: Local links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments --root-dir "${{ github.workspace }}" '*.html'
          fail: true

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.30.1

  e2e:
    name: End-to-end (login, reviews, admin, security rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Firebase CLI and Playwright
        run: |
          npm install --global firebase-tools@15
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Offer unit tests
        run: node --test tests/offer.test.mjs
      - name: Serve the site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 1
      - name: Run tests against Firebase emulators
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          firebase emulators:exec --project demo-antarodaya --only auth,firestore "python3 tests/e2e.py"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
